<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Sign in | Kevid Systems</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand brand-auth" href="login.html" aria-label="Kevid Systems home">
      <span class="brand-mark">K</span><span>kevid<span class="brand-light">systems</span></span>
    </a>
    <section class="auth-card">
      <div class="eyebrow">CUSTOMER AUTOMATION PLATFORM</div>
      <h1 id="auth-heading">Welcome back</h1>
      <p class="muted" id="auth-subheading">Sign in to manage your customer conversations.</p>
      <div id="auth-notice" class="notice hidden" role="status" aria-live="polite"></div>
      <form id="auth-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>
        <label id="confirm-label" for="confirm-password" class="hidden">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" placeholder="Repeat your password" class="hidden">
        <button id="submit-button" class="button button-primary button-full" type="submit">Sign in</button>
      </form>
      <p class="auth-switch"><span id="switch-copy">New to Kevid Systems?</span>
        <button id="switch-mode" class="text-button" type="button">Create account</button>
      </p>
      <p class="auth-footnote">Your workspace is linked to your account. Use an email address you can access.</p>
    </section>
    <p class="copyright">© <span id="year"></span> Kevid Systems</p>
  </main>
</body>
</html>
